name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit_tests:
    name: JUnit tests
    runs-on: ubuntu-latest
    container:
      image: gradle:9.2.1-jdk17
      options: --user 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: gradle test

      - name: Test summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/test-results/test/TEST-*.xml)
          {
            echo "### Výsledky JUnit testů"
            if [ ${#files[@]} -eq 0 ]; then echo "Žádné výsledky testů."; exit 0; fi
            echo "| Třída | Testů | Selhalo | Přeskočeno |"
            echo "|---|---:|---:|---:|"
            for f in "${files[@]}"; do
              line=$(grep -o '<testsuite [^>]*' "$f" | head -1)
              attr() { echo "$line" | sed -n "s/.* $1=\"\([^\"]*\)\".*/\1/p"; }
              echo "| $(attr name) | $(attr tests) | $(( $(attr failures) + $(attr errors) )) | $(attr skipped) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/test/
            app/build/test-results/test/
          if-no-files-found: ignore

  build_application:
    name: Build app-all.jar
    runs-on: ubuntu-latest
    container:
      image: gradle:9.2.1-jdk17
      options: --user 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: gradle build -x test

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-libs
          path: app/build/libs/app-all.jar
          if-no-files-found: error

  smoke_test:
    name: Smoke test (${{ matrix.url }})
    runs-on: ubuntu-latest
    needs: build_application
    strategy:
      fail-fast: false
      matrix:
        # stejné stránky jako školní testy (natt-args.txt) + původní google.com
        url:
          - https://google.com
          - https://www.utb.cz/en/
          - https://jlcpcb.com/

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-libs
          path: app/build/libs

      - name: Run crawler (depth 0, 13 s limit like the grader)
        shell: bash
        env:
          URL: ${{ matrix.url }}
          LC_ALL: C.UTF-8
        run: |
          status=0
          timeout 13s java -jar app/build/libs/app-all.jar "$URL" 0 0 > crawler_output.txt 2> crawler_err.txt || status=$?
          cat crawler_err.txt >&2
          echo "--- výstup ---"
          cat crawler_output.txt
          {
            echo "### $URL"
            echo '```'
            cat crawler_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then echo "::error::Crawler skončil s kódem $status (124 = nestihl 13 s)"; exit 1; fi
          lines=$(wc -l < crawler_output.txt)
          if [ "$lines" -eq 0 ]; then echo "::error::Žádný výstup"; exit 1; fi
          if [ "$lines" -gt 20 ]; then echo "::error::Více než 20 řádků výstupu ($lines)"; exit 1; fi
          if grep -vP '^\p{L}+;[0-9]+$' crawler_output.txt; then echo "::error::Řádek výše není ve formátu slovo;počet"; exit 1; fi
          if ! sort -t';' -k2,2nr -c crawler_output.txt; then echo "::error::Výstup není seřazený sestupně"; exit 1; fi
          echo "OK: $lines řádků ve formátu slovo;počet, seřazeno sestupně."

      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output-${{ strategy.job-index }}
          path: |
            crawler_output.txt
            crawler_err.txt
